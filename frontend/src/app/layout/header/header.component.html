<header class="header">
    <div class="logo">Shankar Ganesh</div>

    <nav>
        <a routerLink="/">Home</a>
        <a routerLink="/about">About</a>
        <a routerLink="/skills">Skills</a>
        <a routerLink="/projects">Projects</a>
        <a routerLink="/experience">Experience</a>
        <a routerLink="/contact">Contact</a>
    </nav>

    <div class="header-actions">
        <button class="theme-toggle" (click)="toggleTheme()" [title]="isLightMode ? 'Switch to Dark Mode' : 'Switch to Light Mode'">
            <span [hidden]="isLightMode">☀️</span>
            <span [hidden]="!isLightMode">🌙</span>
        </button>
        <button class="hire-btn">Hire Me</button>
    </div>
</header>
